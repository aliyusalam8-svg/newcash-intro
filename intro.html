<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Newcash</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#110402; --g3:#ffc77b; --text:#fff7e8; --muted:#b38d6e; --display:'Rajdhani',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; text-align:center;
    background: radial-gradient(520px 420px at 50% 38%, rgba(218,88,12,.38), transparent 68%), radial-gradient(500px 360px at 90% 105%, rgba(160,30,10,.35), transparent 70%), var(--bg); }
  .wrap { position:relative; z-index:2; padding:24px; width:100%; max-width:420px; }
  .coinbox { position:relative; width:168px; height:168px; margin:0 auto 22px; }
  .coinbox::before { content:""; position:absolute; inset:-26px; border-radius:50%; background:radial-gradient(circle, rgba(255,140,30,.55), transparent 66%); animation:pulse 2.4s ease-in-out infinite; }
  .ring { position:absolute; inset:-10px; border-radius:50%; border:2px dashed rgba(255,199,123,.55); animation:spin 14s linear infinite; }
  .coin { position:relative; width:100%; height:100%; animation:float 3s ease-in-out infinite; filter:drop-shadow(0 10px 22px rgba(0,0,0,.6)); }
  h1 { margin:0; font-family:var(--display); font-weight:700; font-size:46px; letter-spacing:.2em; padding-left:.2em; text-shadow:0 0 22px rgba(255,120,30,.75); }
  .sub { margin:4px 0 26px; color:var(--g3); font-family:var(--display); font-weight:600; letter-spacing:.32em; font-size:15px; padding-left:.32em; }
  .bar { height:8px; border-radius:6px; background:#2f0c06; overflow:hidden; margin:0 auto; max-width:260px; }
  .bar i { display:block; height:100%; width:40%; border-radius:6px; background:linear-gradient(90deg,#b43903,#f6781a,#ffc77b); box-shadow:0 0 14px rgba(246,120,26,.7); animation:slide 1.3s ease-in-out infinite; }
  #status { margin:16px 0 0; min-height:22px; color:var(--muted); font-size:14px; letter-spacing:.04em; }
  #tip { margin:30px 0 0; color:#e6c9a6; font-size:14px; line-height:1.5; min-height:42px; transition:opacity .4s; }
  #retry { display:none; margin:18px auto 0; border:0; border-radius:12px; padding:12px 26px; font:700 16px var(--display); letter-spacing:.12em; color:#fff7ea; background:linear-gradient(110deg,#a3140a,#e8400c 45%,#ff8a1f); cursor:pointer; }
  .ember { position:fixed; bottom:-12px; border-radius:50%; background:#ff9c2f; box-shadow:0 0 8px #ff7a1c; opacity:0; z-index:1; animation:rise linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
  @keyframes pulse { 0%,100% { opacity:.65; transform:scale(.96); } 50% { opacity:1; transform:scale(1.06); } }
  @keyframes slide { 0% { transform:translateX(-110%); } 100% { transform:translateX(280%); } }
  @keyframes rise { 0% { transform:translateY(0) translateX(0); opacity:0; } 12% { opacity:.9; } 100% { transform:translateY(-105vh) translateX(var(--dx)); opacity:0; } }
</style></head>
<body>
<div class="wrap">
  <div class="coinbox"><div class="ring"></div><img class="coin" id="coin" alt=""></div>
  <h1>NEWCASH</h1>
  <div class="sub">PLAY &middot; WATCH &middot; EARN</div>
  <div class="bar"><i></i></div>
  <div id="status">Waking the dragon...</div>
  <div id="tip"></div>
  <button id="retry">TRY AGAIN</button>
</div>
<script>
// >>> The only line you may need to change: your real app link (no slash at the end).
var APP_URL = 'https://dra-earn-1.onrender.com';

var TOKEN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#f3b73c"/><stop offset="1" stop-color="#a86b10"/></linearGradient><radialGradient id="face" cx=".35" cy=".3" r=".95"><stop offset="0" stop-color="#a83f11"/><stop offset="1" stop-color="#2e0701"/></radialGradient><linearGradient id="drg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffebc8"/><stop offset="1" stop-color="#da5f13"/></linearGradient><linearGradient id="horn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#e0a52a"/></linearGradient></defs><circle cx="50" cy="50" r="48" fill="url(#rim)"/><circle cx="50" cy="50" r="41.5" fill="url(#face)" stroke="#511003" stroke-width="2"/><circle cx="50" cy="50" r="37" fill="none" stroke="#f3c75a" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="1.5 2.5"/><path d="M30 58 C25 66 25 74 28 80 L47 80 C47 72 42 68 40 62 Z" fill="#bd4a10" stroke="#340802" stroke-width="1.4" stroke-linejoin="round"/><path d="M27 64 L21 62 L26 69 Z M26 72 L20 72 L26 77 Z M30 53 L24 49 L28 58 Z" fill="#f3c75a" stroke="#340802" stroke-width="1" stroke-linejoin="round"/><path d="M41 41 C37 33 31 27 24 25 C29 31 31 36 34 44 Z" fill="url(#horn)" stroke="#340802" stroke-width="1.3" stroke-linejoin="round"/><path d="M50 38 C48 29 44 22 37 18 C40 26 41 31 43 40 Z" fill="url(#horn)" stroke="#340802" stroke-width="1.3" stroke-linejoin="round"/><path d="M42 63 C52 60 62 59 73 58 C79 58 81 61 78 64 C74 68 66 70 58 70 C50 71 44 70 39 67 Z" fill="#ae3b09" stroke="#340802" stroke-width="1.4" stroke-linejoin="round"/><path d="M31 62 C27 54 29 44 38 40 C46 36 58 36 66 39 C74 41 82 44 85 49 C86 52 83 55 78 55 C72 55 67 56 62 57 C56 58 50 59 46 63 C42 67 35 68 31 62 Z" fill="url(#drg)" stroke="#340802" stroke-width="1.5" stroke-linejoin="round"/><path d="M38 52 q3 -3 6 0 M43 56 q3 -3 6 0 M36 58 q3 -3 6 0" fill="none" stroke="#852304" stroke-width="1.1" stroke-linecap="round"/><path d="M51 42 Q58 38 66 42" fill="none" stroke="#340802" stroke-width="1.6" stroke-linecap="round"/><path d="M53 46 Q58 42 64 46 Q58 50 53 46 Z" fill="#ffd93b" stroke="#340802" stroke-width="1"/><ellipse cx="58.5" cy="46" rx="1.3" ry="2.6" fill="#340802"/><circle cx="80" cy="49" r="1.4" fill="#340802"/><path d="M64 57 L66 61 L68 56.6 M70 56.2 L72 60 L74 55.8" fill="#fff" stroke="#340802" stroke-width=".8" stroke-linejoin="round"/></svg>`;
document.getElementById('coin').src = 'data:image/svg+xml;utf8,' + encodeURIComponent(TOKEN_SVG);

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#110402'); tg.setBackgroundColor('#110402'); } catch (e) {} }

// floating embers
for (var i = 0; i < 22; i++) {
  var e = document.createElement('div'); e.className = 'ember';
  var s = 2 + Math.random() * 4;
  e.style.cssText = 'left:' + (Math.random() * 100) + 'vw;width:' + s + 'px;height:' + s + 'px;--dx:' + ((Math.random() - .5) * 90) + 'px;animation-duration:' + (5 + Math.random() * 6) + 's;animation-delay:' + (Math.random() * 6) + 's';
  document.body.appendChild(e);
}

// rotating tips
var tips = ['Win tic tac toe and earn dra.', 'Invite friends and earn 100 dra for each one.', 'Claim your daily reward every day.', 'Finish tasks and redeem promo codes for extra dra.', 'Check our payout channel to see real payouts.'];
var ti = 0, tipEl = document.getElementById('tip');
function tip() { tipEl.style.opacity = 0; setTimeout(function () { tipEl.textContent = tips[ti++ % tips.length]; tipEl.style.opacity = 1; }, 350); }
tip(); setInterval(tip, 3200);

// Wake the app, then go in. The app sends a small answer that only the real app gives
// (a sleeping Render server shows its own page, which fails this check), so we keep trying until it is truly awake.
var started = Date.now(), MIN_SHOW = 1600, GIVE_UP = 75000, done = false;
var statusEl = document.getElementById('status'), retryBtn = document.getElementById('retry');
function go() {
  if (done) return; done = true;
  statusEl.textContent = 'Entering...';
  setTimeout(function () { location.replace(APP_URL + '/' + location.search + location.hash); }, Math.max(0, MIN_SHOW - (Date.now() - started)));
}
function check() {
  if (done) return;
  var ctl = typeof AbortController === 'function' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 9000);
  fetch(APP_URL + '/health?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (d) { clearTimeout(timer); if (d && d.ok) go(); else again(); })
    .catch(function () { clearTimeout(timer); again(); });
}
function again() {
  if (done) return;
  var waited = Date.now() - started;
  if (waited > GIVE_UP) {
    statusEl.textContent = 'This is taking longer than usual.';
    document.querySelector('.bar').style.opacity = .35; retryBtn.style.display = 'block'; return;
  }
  statusEl.textContent = waited > 9000 ? 'Almost there, the dragon is getting up...' : 'Waking the dragon...';
  setTimeout(check, 2500);
}
retryBtn.onclick = function () { retryBtn.style.display = 'none'; document.querySelector('.bar').style.opacity = 1; started = Date.now(); statusEl.textContent = 'Waking the dragon...'; check(); };
check();
</script>
</body></html>
